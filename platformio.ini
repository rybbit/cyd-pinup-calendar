; Pin-Up Calendar for the ESP32-2432S028R "Cheap Yellow Display"
;
; Two display variants of this board exist:
;   cyd       - original board (micro-USB only), ILI9341 controller
;   cyd2usb   - newer board (USB-C, or micro-USB + USB-C), ST7789 controller
; If the screen stays white / garbled, flash the other one.
; If colors look like a photo negative, toggle TFT_INVERSION_ON/OFF.
; If red and blue are swapped, toggle the TFT_RGB_ORDER line.

[platformio]
default_envs = cyd2usb

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    bblanchon/ArduinoJson@7.2.1

; --- Catalog location -----------------------------------------------------
; Raw GitHub URL of content/catalog.json once this repo is pushed to GitHub.
; Can be overridden with a catalog= line in /config/wifi.conf on the SD card.
; TFT_eSPI is configured here instead of editing the library's User_Setup.h.
; To swap red/blue on cyd2usb, add -DTFT_RGB_ORDER=TFT_BGR to its build_flags.
build_flags_common =
    -DCATALOG_URL_DEFAULT=\"https://raw.githubusercontent.com/rybbit/cyd-pinup-calendar/main/content/catalog.json\"
    -DTZ_DEFAULT=\"EST5EDT,M3.2.0,M11.1.0\"
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:cyd]
build_flags =
    ${env.build_flags_common}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
build_flags =
    ${env.build_flags_common}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
